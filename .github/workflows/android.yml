name: App Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Restore permanent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo "Missing permanent signing key" >&2; exit 1; }
          test -n "$HERMES_KEYSTORE_PASSWORD" || { echo "Missing signing password" >&2; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/hermes-release.p12"

      - name: Build signed release APK
        env:
          HERMES_KEYSTORE_FILE: ${{ runner.temp }}/hermes-release.p12
          HERMES_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/apk-signature.txt"
          expected=$(tr -d '[:space:]' < ../.github/android-signing-cert.sha256)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
          test "$actual" = "$expected" || { echo "Unexpected APK signing certificate" >&2; exit 1; }

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/hermes-release.p12"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-pt2-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  watch:
    name: Build store PBW
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Pebble SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/pebble-tools"
          "$RUNNER_TEMP/pebble-tools/bin/pip" install pebble-tool==5.0.40
          echo "$RUNNER_TEMP/pebble-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pebble-tools/bin/pebble" sdk install 4.33.1
          "$RUNNER_TEMP/pebble-tools/bin/pebble" sdk activate 4.33.1
      - name: Build and verify companion metadata
        run: |
          pebble build
          python3 tools/check_local.py
          python3 tools/finalize_pbw.py --package package.json --input build/hermes-pebble.pbw --output build/hermes-pebble-store.pbw
      - name: Upload store PBW
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-pebble-store
          path: build/hermes-pebble-store.pbw
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish APK and PBW release
    needs: [android, watch]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download APK and PBW
        run: |
          gh run download "$GITHUB_RUN_ID" --name hermes-pt2-android-release --dir release
          mv release/app-release.apk release/hermes-pebble.apk
          gh run download "$GITHUB_RUN_ID" --name hermes-pebble-store --dir release

      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/hermes-pebble.apk release/hermes-pebble-store.pbw --clobber
          else
            cat > release-notes.md <<'EOF'
          Install `hermes-pebble.apk` on Android and open `hermes-pebble-store.pbw` in the Pebble phone app. The PBW includes the Android companion declaration and is the artifact to upload to the Pebble app store.

          This sideloadable release uses the permanent signing key introduced in v0.1.3. Future releases retain this signature for in-place updates.

          Moving from v0.1.2 or earlier requires a one-time uninstall/reinstall because those builds used disposable signing keys. Uninstalling clears local settings, credentials, notes, and history; save anything needed first.
          EOF
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/hermes-pebble.apk release/hermes-pebble-store.pbw \
              --verify-tag --title "Hermes Pebble $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes "${release_flags[@]}"
          fi
